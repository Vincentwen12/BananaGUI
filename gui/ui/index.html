<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>BananaGUI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="titlebar-left">
          <button class="icon-btn" id="sidebar-toggle" aria-label="切换侧栏" aria-pressed="true"></button>
          <div class="titlebar-menu">
            <button class="menu-btn" data-menu="app" aria-haspopup="menu" aria-expanded="false">应用</button>
            <button class="menu-btn" data-menu="edit" aria-haspopup="menu" aria-expanded="false">编辑</button>
          </div>
        </div>
        <div class="titlebar-right">
          <div class="titlebar-status" id="connection-status">
            <span class="dot" id="connection-dot"></span>
            <span id="connection-label">本地</span>
          </div>
          <div class="window-controls" id="window-controls">
            <button class="icon-btn" data-window="minimize" aria-label="最小化"></button>
            <button class="icon-btn" data-window="maximize" aria-label="最大化"></button>
            <button class="icon-btn close" data-window="close" aria-label="关闭"></button>
          </div>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar" id="sidebar" aria-label="侧栏">
          <div class="sidebar-top">
            <div class="brand">
              <span class="brand-mark" id="brand-mark"></span>
              <span class="brand-word">banana</span>
              <span class="brand-badge">GUI</span>
            </div>
            <div class="new-row">
              <button class="new-session" id="new-session">
                <span id="new-session-icon"></span>
                新会话
              </button>
              <button class="square-btn" id="import-session" title="导入会话 JSON" aria-label="导入会话 JSON"></button>
            </div>
            <nav class="primary-nav" aria-label="主导航">
              <button class="nav-item" data-panel="plugins">
                <span data-icon="puzzle"></span>
                插件
              </button>
              <button class="nav-item" data-panel="tasks">
                <span data-icon="clock"></span>
                任务
              </button>
              <button class="nav-item" data-menu="more">
                <span data-icon="grid"></span>
                更多
              </button>
            </nav>
          </div>
          <div class="workspace-head">
            <span class="workspace-title">工作区</span>
            <div class="workspace-actions">
              <button class="icon-btn" id="workspace-search-toggle" aria-label="搜索工作区" aria-pressed="false"></button>
              <button class="icon-btn" id="workspace-filter" aria-label="过滤工作区"></button>
              <button class="icon-btn" id="add-workspace" aria-label="添加工作区"></button>
            </div>
          </div>
          <div class="workspace-search" id="workspace-search">
            <input id="workspace-search-input" type="search" placeholder="搜索工作区或会话" autocomplete="off" />
          </div>
          <div class="workspace-list" id="workspace-list"></div>
          <div class="sidebar-foot">
            <button class="foot-btn" data-menu="more">
              <span data-icon="ellipsis"></span>
              更多
            </button>
          </div>
        </aside>

        <div class="main-wrap" id="main-wrap">
          <main class="main is-empty" id="main">
            <div class="main-top">
              <div class="session-tabs" id="session-tabs"></div>
              <div class="crumbs" id="crumbs"></div>
              <div class="main-top-actions">
                <button class="icon-btn" id="session-more" aria-label="当前对话操作"></button>
                <button class="icon-btn" id="terminal-toggle" aria-label="切换终端" aria-pressed="false"></button>
                <button class="icon-btn" id="panel-toggle" aria-label="切换右侧面板" aria-pressed="false"></button>
              </div>
            </div>

            <div class="conversation" id="conversation">
              <div class="empty-layout" id="empty-view">
                <div class="welcome">
                  <div class="welcome-lockup">
                    <span class="welcome-mark" id="welcome-mark"></span>
                    <h1 class="welcome-title">探索香蕉之境</h1>
                    <span class="welcome-badge">预览版</span>
                  </div>
                  <div class="welcome-hint">说想法，香蕉来落地</div>
                </div>
                <div class="onboarding hidden" id="onboarding">
                  <span data-icon="warning"></span>
                  <span id="onboarding-text">还没有配置模型</span>
                  <button id="onboarding-open">去设置</button>
                </div>
              </div>

              <div class="messages hidden" id="messages" aria-live="off"></div>
              <button class="scroll-latest" id="scroll-latest" aria-label="回到最新"></button>
            </div>

            <div class="composer-shell" id="composer-shell">
              <div class="composer-inner">
                <div class="approval-root" id="approval-root"></div>
                <div class="todo-bar hidden" id="todo-bar">
                  <button class="todo-head" id="todo-head" aria-expanded="false">
                    <span data-icon="layer"></span>
                    <span>任务</span>
                    <span class="todo-count" id="todo-count">0/0</span>
                    <span class="chevron" data-icon="chevron-right"></span>
                  </button>
                  <div class="todo-progress" id="todo-progress"><span style="width: 0%"></span></div>
                  <ul class="todo-list" id="todo-list"></ul>
                </div>

                <div class="composer-context">
                  <button class="context-btn" id="workspace-menu-btn" aria-haspopup="menu" aria-expanded="false">
                    <span data-icon="folder"></span>
                    <span class="ctx-label" id="context-workspace">dschat</span>
                    <span class="chevron" data-icon="chevron-down"></span>
                  </button>
                  <span class="context-sep"></span>
                  <button class="context-btn" id="reasoning-menu-btn" aria-haspopup="menu" aria-expanded="false">
                    <span data-icon="settings"></span>
                    <span class="ctx-label" id="context-reasoning">标准模式</span>
                    <span class="chevron" data-icon="chevron-down"></span>
                  </button>
                </div>

                <form class="composer" id="composer" autocomplete="off">
                  <textarea
                    id="prompt"
                    rows="2"
                    placeholder="描述你想要构建的内容，/ 调用指令，@ 文件或对话"
                    aria-label="输入消息"
                    spellcheck="false"
                  ></textarea>
                  <div class="attachment-row" id="attachment-row"></div>
                  <div class="composer-bar">
                    <button type="button" class="composer-btn round" id="attach-image" title="附加图片" aria-label="附加图片">
                      <span data-icon="plus"></span>
                    </button>
                    <button type="button" class="composer-btn mode-btn" id="mode-btn" aria-haspopup="menu" aria-expanded="false">
                      <span data-icon="shield"></span>
                      <span class="mode-text" id="mode-label">工作区内修改</span>
                      <span class="chevron" data-icon="chevron-down"></span>
                    </button>
                    <span class="composer-spacer"></span>
                    <button type="button" class="composer-btn model-btn" id="model-btn" aria-haspopup="menu" aria-expanded="false">
                      <span class="model-name" id="model-label">尚未配置模型</span>
                      <span class="reasoning-label" id="reasoning-label"></span>
                      <span class="chevron" data-icon="chevron-down"></span>
                    </button>
                    <button type="submit" class="send-btn" id="send-btn" aria-label="发送">
                      <span data-icon="arrow-up"></span>
                    </button>
                  </div>
                </form>
                <div class="composer-foot">
                  <span id="composer-hint">Enter 发送 · Shift+Enter 换行 · / 命令 · @ 文件</span>
                  <span id="composer-usage"></span>
                </div>
                <input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
                <input type="file" id="import-input" accept="application/json,.json" hidden />
              </div>
            </div>

            <div class="status-bar" id="status-bar">
              <div class="status-left" id="status-left"></div>
              <div class="status-right" id="status-right"></div>
            </div>

            <div class="terminal-drawer" id="terminal-drawer">
              <div class="terminal-head">
                <span data-icon="terminal"></span>
                <span class="terminal-title">终端 · 工作区</span>
                <button class="icon-btn" id="terminal-restart" aria-label="重启终端"></button>
                <button class="icon-btn" id="terminal-close" aria-label="关闭终端"></button>
              </div>
              <div class="terminal-host" id="terminal-host"></div>
            </div>
          </main>

          <aside class="side-panel" id="side-panel" aria-label="右侧面板">
            <div class="panel-head">
              <div class="panel-tabs" role="tablist" id="panel-tabs">
                <button class="panel-tab" role="tab" data-tab="files" aria-selected="true">文件</button>
                <button class="panel-tab" role="tab" data-tab="tasks" aria-selected="false">任务</button>
                <button class="panel-tab" role="tab" data-tab="plugins" aria-selected="false">插件</button>
                <button class="panel-tab" role="tab" data-tab="terminal" aria-selected="false">终端</button>
                <button class="panel-tab" role="tab" data-tab="info" aria-selected="false">信息</button>
              </div>
              <button class="icon-btn" id="panel-close" aria-label="关闭右侧面板"></button>
            </div>
            <div class="panel-body" id="panel-body"></div>
          </aside>
        </div>
      </div>
    </div>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <div id="overlay-root"></div>
    <div id="menu-root"></div>
    <div id="completion-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <script src="/vendor/xterm.js" defer></script>
    <script src="/vendor/addon-fit.js" defer></script>
    <script src="/vendor/highlight.min.js" defer></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
